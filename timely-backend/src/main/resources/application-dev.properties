app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.registration-enabled=${REGISTRATION_ENABLED:true}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.issuer=timely-backend
app.jwt.audience=timely-api
app.refresh-token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:2592000000}
app.refresh-token.audience=timely-refresh
app.auth-cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth-cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}

spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG
