app.frontend-url=${FRONTEND_URL}
app.registration-enabled=${REGISTRATION_ENABLED:false}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.issuer=timely-backend
app.jwt.audience=timely-api
app.refresh-token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:2592000000}
app.refresh-token.audience=timely-refresh
app.auth-cookie.secure=${AUTH_COOKIE_SECURE:true}
app.auth-cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}

spring.jpa.show-sql=false
logging.level.org.springframework.security=INFO

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

server.forward-headers-strategy=framework
