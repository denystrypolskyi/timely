spring.application.name=backend

# Load shared database settings from the repository root and backend-only
# settings from this module. Deployed containers may use environment variables.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# PostgreSQL DataSource Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate/JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

spring.profiles.default=dev
